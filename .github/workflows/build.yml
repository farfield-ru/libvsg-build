name: Build VSG

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VSG_TAG: v1.1.15
  VSGXCHANGE_TAG: v1.1.13
  VSGIMGUI_TAG: v0.7.0
  ASSIMP_TAG: v6.0.4
  GLSLANG_TAG: 16.3.0
  VULKAN_SDK_VERSION: 1.4.341.1

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: true
      matrix:
        # windows-2022 (VS 2022, MSVC 14.4x), NOT windows-latest: the VS 2026
        # toolset on windows-latest (MSVC 14.51) has a documented known issue
        # "cl.exe hangs compiling some source files" and deterministically
        # hangs on assimp's vendored contrib sources (6h job timeout). The
        # MSVC 14.x ABI is stable, so VS 2026 consumers link these DLLs fine.
        # Revisit when the MSVC fix ships.
        os: [ubuntu-latest, windows-2022]
        build_type: [Release, Debug, RelWithDebInfo]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        # libxcb1-dev + pkg-config: required by VSG's xcb windowing support
        # (vsgConfig.cmake pkg_check_modules(xcb REQUIRED) - consumers need
        # the same package at configure time).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libxcb1-dev

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Vulkan SDK (Linux)
        # Same action + commit pin as VulkanSceneGraph's own CI. Linux-only:
        # the action's Windows path merely 7z-extracts the installer and the
        # result has no Lib/vulkan-1.lib, so find_package(Vulkan) fails.
        if: runner.os == 'Linux'
        uses: humbletim/install-vulkan-sdk@e7d6e7b937bde4503c7ba5c9584c9dc68f44c4b8
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Cache Vulkan SDK (Windows)
        # The '-rt' key suffix busted the pre-RTBin cache when the runtime DLL
        # started being cached alongside the SDK (see the install step below).
        if: runner.os == 'Windows'
        id: vulkan-cache
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}-rt

      - name: Install Vulkan SDK (Windows)
        # Official LunarG silent install (Qt IFW installer). The installer also
        # puts the runtime loader (vulkan-1.dll) into System32, but System32 is
        # not cacheable and every job runs on a fresh VM - so stash a copy
        # inside the cached SDK tree (RTBin/ is our own dir; the SDK itself
        # ships no vulkan-1.dll anywhere). The restore step below puts it back
        # on cache-hit runs. Needed to RUN the consumer smoke test; the DLL
        # stays outside the install prefix so it can never leak into the
        # packaged artifact.
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Installer = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
          curl.exe -sSL -o $Installer "https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/windows/vulkan_sdk.exe"
          Start-Process -Wait $Installer -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          $RTBin = "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}\RTBin"
          New-Item -ItemType Directory -Force $RTBin | Out-Null
          Copy-Item 'C:\Windows\System32\vulkan-1.dll' $RTBin

      - name: Restore Vulkan runtime DLL (Windows)
        # Fresh VM + cache-hit means the installer above was skipped and no
        # vulkan-1.dll exists anywhere on the machine; vsg.dll imports it, so
        # the smoke test binary cannot even load without this.
        if: runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          Copy-Item "C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}\RTBin\vulkan-1.dll" 'C:\Windows\System32'

      - name: Export VULKAN_SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build.sh ${{ matrix.build_type }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -BuildType ${{ matrix.build_type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsg-${{ env.VSG_TAG }}-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x64-${{ matrix.build_type }}
          path: _work/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vsg-${VSG_TAG}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "VulkanSceneGraph ${VSG_TAG} shared libraries" \
              --notes "VulkanSceneGraph ${VSG_TAG}, vsgXchange ${VSGXCHANGE_TAG} and vsgImGui ${VSGIMGUI_TAG} built as shared libraries for Linux (x64) and Windows (x64, MSVC) in Release, Debug and RelWithDebInfo configurations. glslang ${GLSLANG_TAG} (VSG runtime shader compiler) and assimp ${ASSIMP_TAG} (vsgXchange model importers) are statically absorbed. vsgImGui compiles its pinned imgui/implot submodules in and re-exports the full ImGui/ImPlot API from the DLL."
          gh release upload "$TAG" dist/* --clobber
