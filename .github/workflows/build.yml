name: Build VSG

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VSG_TAG: v1.1.15
  VSGXCHANGE_TAG: v1.1.13
  VSGIMGUI_TAG: v0.7.0
  ASSIMP_TAG: v6.0.4
  GLSLANG_TAG: 16.3.0

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: true
      matrix:
        # windows-2022 (VS 2022, MSVC 14.4x), NOT windows-latest: the VS 2026
        # toolset on windows-latest (MSVC 14.51) has a documented known issue
        # "cl.exe hangs compiling some source files" and deterministically
        # hangs on assimp's vendored contrib sources (6h job timeout). The
        # MSVC 14.x ABI is stable, so VS 2026 consumers link these DLLs fine.
        # Revisit when the MSVC fix ships.
        os: [ubuntu-latest, windows-2022]
        build_type: [Release, Debug, RelWithDebInfo]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        # libxcb1-dev + pkg-config: required by VSG's xcb windowing support
        # (vsgConfig.cmake pkg_check_modules(xcb REQUIRED) - consumers need
        # the same package at configure time).
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libxcb1-dev

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build.sh ${{ matrix.build_type }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -BuildType ${{ matrix.build_type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsg-${{ env.VSG_TAG }}-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x64-${{ matrix.build_type }}
          path: _work/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vsg-${VSG_TAG}"
          TITLE="VulkanSceneGraph ${VSG_TAG} static libraries"
          NOTES="VulkanSceneGraph ${VSG_TAG}, vsgXchange ${VSGXCHANGE_TAG} and vsgImGui ${VSGIMGUI_TAG} built as static (PIC) libraries for Linux (x64) and Windows (x64, MSVC, dynamic CRT) in Release, Debug and RelWithDebInfo configurations, consumed through a single dependency-free CMake config: find_package(vsgall) -> vsgall::vsgall. glslang ${GLSLANG_TAG} (VSG runtime shader compiler), assimp ${ASSIMP_TAG} (vsgXchange model importers) and vsgImGui's pinned imgui/implot submodules are part of the stated link line. The prefix carries the Vulkan headers and link artifact; the runtime Vulkan loader comes from the host system."
          # Edit-if-exists so the notes always describe the CURRENT artifact
          # shape - assets are re-uploaded on every main push, and notes that
          # describe a previous shape would misdescribe the downloads.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/* --clobber
